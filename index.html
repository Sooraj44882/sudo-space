<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>sudo-space</title>
  </head>
  <body>

  <div class="container">
      
      <div id="search-section" class="glass-box">
        <form id="search-form">
          <label for="search-input" class="prompt">> sudo search google:</label>
          <input type="text" id="search-input" placeholder="type here and hit enter..." autocomplete="off" autofocus>
        </form>
      </div>
      <div class="row">
        <div id="links-widget" class="glass-box">
          <p class="prompt-green">> sudo bookmarks_</p>
          <div class="shortcuts-grid">
            <a href="https://github.com" target="_blank" class="shortcut-btn">gh: github</a>
            <a href="https://youtube.com" target="_blank" class="shortcut-btn">yt: youtube</a>
            <a href="https://reddit.com" target="_blank" class="shortcut-btn">rd: reddit</a>
            <a href="https://instagram.com" target="_blank" class="shortcut-btn">in: instagram</a>
          </div>
        </div>
        

        <div id="nasa-widget" class="glass-box">
          <p class="prompt">> sudo fetch apod_pic</p>
          
          <img id="nasa-pic" src="" alt="Space picture" style="display: none;" />

          <iframe id="nasa-video" src="" frameborder="0" allowfullscreen style="display: none;"></iframe>
          
          <p id="nasa-title"></p>
        </div>
       
       </div> 

      </div>
    </div>
        <div id="todo-widget" class="glass-box">
          <p class="prompt">> sudo tasks_</p>
          <form id="todo-form">
            <input type="text" id="todo-input" placeholder="new task..." autocomplete="off" />
          </form>
          <ul id="todo-list"></ul>
        </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
